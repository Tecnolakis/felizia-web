<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Felizia · Sitio en construcción</title>
  <meta name="description" content="Felizia — Llevamos la IA al corazón de tu negocio. Sitio en construcción.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 140'%3E%3Cpath d='M22 40 A78 78 0 0 0 172 52' fill='none' stroke='%231B3A6F' stroke-width='22' stroke-linecap='round'/%3E%3Ccircle cx='176' cy='36' r='22' fill='%23FF7A50'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1B3A6F;
      --orange: #FF7A50;
      --bg: #FBFBFA;
      --muted: #5B6B85;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--navy);
      font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      text-align: center;
    }
    main { max-width: 560px; width: 100%; }
    .logo {
      width: min(220px, 55vw);
      height: auto;
      display: block;
      margin: 0 auto 28px;
    }
    .logo .dot { animation: bob 2.8s ease-in-out infinite; transform-origin: center; }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .brand {
      font-size: clamp(2.2rem, 7vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 18px 0 14px;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255, 122, 80, 0.12);
      color: #C2482A;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .badge::before {
      content: "";
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--orange);
    }
    p.highlight {
      color: var(--navy);
      font-size: clamp(1.25rem, 4.6vw, 1.6rem);
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }
    p.sub {
      margin-top: 14px;
      color: var(--orange);
      font-size: clamp(1rem, 3.6vw, 1.15rem);
      font-weight: 600;
    }
    .url {
      display: inline-block;
      margin-top: 32px;
      color: var(--navy);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 2px solid var(--orange);
      padding-bottom: 2px;
    }
    .group {
      position: fixed;
      right: 24px;
      bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.85rem;
      text-decoration: none;
    }
    .group img {
      width: 56px;
      height: 56px;
      mix-blend-mode: multiply;
    }
    .group span { text-align: left; line-height: 1.3; }
    .group strong { color: var(--navy); font-weight: 800; }
    @media (max-width: 600px), (max-height: 560px) {
      body { flex-direction: column; }
      .group {
        position: static;
        margin-top: 48px;
        justify-content: center;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <svg class="logo" viewBox="0 0 200 140" role="img" aria-label="Logo de Felizia">
      <path d="M22 40 A78 78 0 0 0 172 52" fill="none" stroke="#1B3A6F" stroke-width="22" stroke-linecap="round"/>
      <circle class="dot" cx="176" cy="36" r="22" fill="#FF7A50"/>
    </svg>
    <h1 class="brand">Felizia</h1>
    <div class="badge">Sitio en construcción</div>
    <p class="highlight">Llevamos la IA al corazón de tu negocio.<br>Muy pronto vas a conocer cómo.</p>
    <p class="sub">¡Cosas buenas están por venir!</p>
    <a class="url" href="https://www.felizia.com.ar">www.felizia.com.ar</a>
  </main>
  <a class="group" href="https://www.tecnolakis.com.ar" target="_blank" rel="noopener">
    <img src="tecnolakis.jpg" alt="Logo de Tecnolakis" width="56" height="56">
    <span>Una división de<br><strong>Grupo Tecnolakis</strong></span>
  </a>
</body>
</html>
